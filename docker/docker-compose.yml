# Jeez Fitness - Docker Compose 配置
# 合并版本 - 兼容旧版 docker-compose

# ============================================
# 基础设施服务
# ============================================

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: jeez-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeez_fitness}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: jeez-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jeez-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEPRECATED_FEATURES_PERMITTED_FOR_REMOVAL: management_metrics_collection
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nacos 配置中心
  nacos:
    image: nacos/nacos-server:v2.1.2
    container_name: jeez-nacos
    restart: unless-stopped
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_PORT_2:-9849}:9849"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
      TZ: Asia/Shanghai
    volumes:
      - nacos-logs:/home/nacos/logs
    networks:
      - jeez-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: jeez-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO 初始化
  minio-init:
    image: minio/mc:latest
    container_name: jeez-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - jeez-network
    entrypoint: >
      /bin/sh -c "
      mc alias set jeez http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb -p jeez/${MINIO_BUCKET_NAME:-jeez-fitness};
      mc anonymous set download jeez/${MINIO_BUCKET_NAME:-jeez-fitness};
      echo 'MinIO initialized successfully';
      "

  # ============================================
  # Gateway 网关服务
  # ============================================
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    container_name: jeez-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/gateway:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Auth 认证服务
  # ============================================
  auth:
    build:
      context: ..
      dockerfile: Dockerfile
      target: auth
    container_name: jeez-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-jeez-fitness}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/auth:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - jeez-network

  # ============================================
  # Member 会员服务
  # ============================================
  member:
    build:
      context: ..
      dockerfile: Dockerfile
      target: member
    container_name: jeez-member
    restart: unless-stopped
    ports:
      - "${MEMBER_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-jeez-fitness}
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-}
      FEIGN_CLIENT_COURSE_URL: http://course:8086
      FEIGN_CLIENT_STORE_URL: http://store:8083
      FEIGN_CLIENT_COACH_URL: http://coach:8085
      FEIGN_CLIENT_AUTH_URL: http://auth:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      WECHATPAY_ENABLED: ${WECHATPAY_ENABLED:-false}
      WECHATPAY_MERCHANT_ID: ${WECHATPAY_MERCHANT_ID:-1234567890}
      WECHATPAY_PRIVATE_KEY_PATH: ${WECHATPAY_PRIVATE_KEY_PATH:-/app/apiclient_key.pem}
      WECHATPAY_MERCHANT_SERIAL_NUMBER: ${WECHATPAY_MERCHANT_SERIAL_NUMBER:-0000000000000000000000000000000000000000}
      WECHATPAY_API_V3_KEY: ${WECHATPAY_API_V3_KEY:-0123456789abcdef0123456789abcdef}
      WECHATPAY_APP_ID: ${WECHATPAY_APP_ID:-wx0000000000000000}
      WECHATPAY_NOTIFY_URL: ${WECHATPAY_NOTIFY_URL:-http://localhost:8080/member/api/member/cards/pay-notify}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/member:/app/logs
      - ./cert/apiclient_key.pem:/app/apiclient_key.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jeez-network

  # ============================================
  # Store 门店服务
  # ============================================
  store:
    build:
      context: ..
      dockerfile: Dockerfile
      target: store
    container_name: jeez-store
    restart: unless-stopped
    ports:
      - "${STORE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-jeez-fitness}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/store:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - jeez-network

  # ============================================
  # Equipment 设备服务
  # ============================================
  equipment:
    build:
      context: ..
      dockerfile: Dockerfile
      target: equipment
    container_name: jeez-equipment
    restart: unless-stopped
    ports:
      - "${EQUIPMENT_PORT:-8084}:8084"
      - "${EQUIPMENT_WS_PORT:-7788}:7788"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-jeez-fitness}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/equipment:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - jeez-network

  # ============================================
  # Coach 教练服务
  # ============================================
  coach:
    build:
      context: ..
      dockerfile: Dockerfile
      target: coach
    container_name: jeez-coach
    restart: unless-stopped
    ports:
      - "${COACH_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/coach:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jeez-network

  # ============================================
  # Course 课程服务
  # ============================================
  course:
    build:
      context: ..
      dockerfile: Dockerfile
      target: course
    container_name: jeez-course
    restart: unless-stopped
    ports:
      - "${COURSE_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/course:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jeez-network

  # ============================================
  # Manager 管理服务
  # ============================================
  manager:
    build:
      context: ..
      dockerfile: Dockerfile
      target: manager
    container_name: jeez-manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-8087}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jeez_fitness}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_BASE_PATH: /app/logs
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ./logs/manager:/app/logs/jeez-manager-fitness
      - ./logs/gateway:/app/logs/jeez-gateway:ro
      - ./logs/auth:/app/logs/jeez-auth-fitness:ro
      - ./logs/member:/app/logs/jeez-member-fitness:ro
      - ./logs/store:/app/logs/jeez-store-fitness:ro
      - ./logs/equipment:/app/logs/jeez-equipment-fitness:ro
      - ./logs/coach:/app/logs/jeez-coach-fitness:ro
      - ./logs/course:/app/logs/jeez-course-fitness:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jeez-network

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    build:
      context: ../nginx/docker
      dockerfile: Dockerfile
    container_name: jeez-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      gateway:
        condition: service_healthy
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - jeez-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ============================================
# 网络和卷配置
# ============================================

networks:
  jeez-network:
    driver: bridge
    name: jeez-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  nacos-logs:
    driver: local
