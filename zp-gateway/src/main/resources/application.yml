server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: jeez-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  codec:
    max-in-memory-size: 64MB
  cloud:
    gateway:
      x-forwarded:
        enabled: true
        for-enabled: true
        host-enabled: true
        port-enabled: true
        proto-enabled: true
        prefix-enabled: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: minio-service
          uri: ${jeez.gateway.services.minio}
          predicates:
            - Path=/jeez-fitness/**
          filters:
            - StripPrefix=0
        - id: room-service
          uri: ${jeez.gateway.services.room}
          predicates:
            - Path=/room-service/**,/roomCategoryGroups/**,/rooms/**,/roomType/**,/roomCategories/page/get,/roomCategory/photo/upload,/roomStatusesToday/**,/roomStatuses/**,/report/dailyRoomStatus/get,/report/forwardRoomStatus/get,/roomCategoryStatuses/central/get,/roomCategoryStatuses/central/saleStatus/save,/roomCategoryStatuses/roomCategory/channel/get,/roomCategoryStatuses/roomCategory/get,/roomCategoryPricings/get,/roomCategoryRules/get,/roomCategoryPrice/**,/systemConfig/price/**,/cleanTask/**,/clean/statistics/**,/cleaner/**,/cleanLog/**,/cleanSettings/**,/cleanManage/cleanSetting/**,/cleanManage/cleanLog/**,/houseManage/logs/price/**
        - id: order-service
          uri: ${jeez.gateway.services.order}
          predicates:
            - Path=/order-service/**,/finance-service/**,/order/report/get,/orders/get,/orders/house/page/get,/orders/houseLongRental/page/get,/orders/detail/get,/orders/strongReminder/page/get,/orders/page/get,/orders/create,/channelOrders/import,/orders/*/cancel,/orders/*/skip-stock,/orders/*/mark-no-show,/orders/*/check-in,/orders/*/check-out,/orders/*/guests/save,/orders/*/change-room/options,/orders/*/change-room,/coupons/page/get,/couponSendConfigs/page/get,/paymentWays/get,/paymentTypes/get,/paymentTypes/get/v2,/paymentTypes/custom/create,/paymentSettings/list,/paymentSettings/detail,/paymentSettings/create,/paymentSettings/status/update,/paymentSettings/default/update,/paymentSettings/sort/update,/paymentSettings/export,/orderLedger/dashboard/get,/accountBookPaymentWay/page/get,/report/storer/statement/get,/distribution/orders/page/get,/channels/social/overview,/channels/custom/list,/channels/custom/create,/channels/custom/update,/channels/custom/delete,/promotionPlanProducts/page/get,/report/promotion/get,/report/promotion/productSale/page/get,/shiftWorkConfig/page/get,/shiftWorkConfig/save,/shiftWorkGoods/page/get,/shiftWorkGoods/save,/shiftWorkReport/page/get
        - id: crm-service
          uri: ${jeez.gateway.services.crm}
          predicates:
            - Path=/crm-service/**,/customers/page/get,/customers/detail/get,/customers/save,/memberTagGroup/**,/wxCpOpen/accounts/get,/wxcp/kfAccount/**,/scrm/sidebarPreview/**,/imWordsGroup/**,/imWords/**,/imYunxinUser/get,/systemMessage/page/get,/systemMessage/unReadCount/get,/systemMessage/read/all,/systemMessage/read/update,/userAuthority/notification/get,/userAuthority/exclude
        - id: platform-service
          uri: ${jeez.gateway.services.platform}
          predicates:
            - Path=/auth/**,/user/**,/camps/**,/camp/**,/campRoles/get,/menus/**,/menu/**,/commons/get,/systemConfigs/**,/systemConfig/**,/printSettings/**,/memberSettings/**,/channels/**,/edition/**,/version/**,/company/**,/role/**,/roleAuthority/**,/paymentWays/**,/paymentTypes/**,/paymentSettings/**,/orderLedger/**,/ota/**,/distribution/**,/smsAccount/**,/smsTemplateMsgConfig/**,/roomCategories/**,/roomCategory/**,/channelRoomCategories/**,/weiRoomCategories/**,/youzan/**,/select/**,/categories/get,/cleanLog/page/get,/checkinGuestPsbLog/**,/radarConfig/shop/get,/globalRadar/**,/report/monthly/page/get,/roomStatusOperationLog/page/get/v2,/report/homePage/v2,/report/accommodation/get,/report/accommodation/management/analysis/get,/report/profit/get/v2,/statistics/profit-report/export,/statistics/profit-report/export/download,/campFlow/get,/memo/page/get,/memo/add,/memo/handle,/backlogs/get
        - id: swagger-gateway-redirect
          uri: no://op
          predicates:
            - Path=/swagger-ui.html
          filters:
            - RedirectTo=302,/swagger-gateway.html
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
      connect-timeout: 3000ms

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer
  is-log: false
  is-read-cookie: false
  is-read-header: true
  check-token-sign: true

logging:
  level:
    com.jeez.gateway: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-gateway.html
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs-gateway
    enabled: true

jeez:
  gateway:
    services:
      minio: http://localhost:9000
      platform: http://localhost:8092
      room: http://localhost:8091
      order: http://localhost:8094
      crm: http://localhost:8095
      zp-order: http://localhost:8094
      zp-inventory: http://localhost:8092
      zp-cleaning: http://localhost:8095
      zp-channel: http://localhost:8097
    auth:
      exclude-paths:
        - /
        - /index.html
        - /css/**
        - /js/**
        - /images/**
        - /favicon.ico
        - /jeez-fitness/**
        - /swagger-ui.html
        - /swagger-gateway.html
        - /**/swagger-ui/**
        - /**/v3/api-docs/**
        - /v3/api-docs-gateway/**
        - /swagger-resources/**
        - /**/webjars/**
        - /**/actuator/**
        - /actuator/**
        - /room-service/ping
        - /order-service/ping
        - /crm-service/ping
        - /finance-service/ping
        - /auth/login
        - /auth/register
        - /auth/register/options
