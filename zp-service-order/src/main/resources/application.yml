server:
  port: 8094

spring:
  application:
    name: zp-service-order
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/zp_pms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jeez.zp.order.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info

order:
  security:
    id-card-secret: ${ORDER_ID_CARD_SECRET:}
