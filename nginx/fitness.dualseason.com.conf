# ============================================================================
# Nginx 配置文件 - fitness.dualseason.com
# 功能: 为 Jeez 健身房管理系统提供 HTTPS 代理和反向代理服务
# 特性:
#   - HTTPS/SSL 支持，强制HTTP重定向
#   - 微服务API网关代理 (/api)
#   - Swagger API 文档代理
#   - MinIO 对象存储反向代理 (/minio)
#   - 完整的CORS跨域支持
#   - WebSocket 支持
#   - 大文件上传支持 (50M)
#   - 安全头配置
#   - 性能优化 (缓冲、超时等)
# ============================================================================

# ============================================================================
# CORS 配置优化 - 使用 map 指令减少重复代码
# ============================================================================
map $request_method $cors_method {
    OPTIONS "GET, POST, PUT, DELETE, OPTIONS, PATCH";
    default "";
}

map $request_method $cors_header {
    OPTIONS "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, X-File-Name";
    default "";
}

# ============================================================================
# HTTPS 服务器配置
# ============================================================================
server {
    listen 443 ssl http2;
    server_name fitness.dualseason.com;

    # ========== SSL/TLS 证书配置 ==========
    ssl_certificate /home/ubuntu/fitness.dualseason.com_nginx/fitness.dualseason.com_bundle.crt;
    ssl_certificate_key /home/ubuntu/fitness.dualseason.com_nginx/fitness.dualseason.com.key;

    # ========== SSL/TLS 安全配置 ==========
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== 安全头配置 ==========
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # ========== 日志配置 ==========
    access_log /var/log/nginx/fitness.dualseason.com.access.log;
    error_log /var/log/nginx/fitness.dualseason.com.error.log;

    # ========== 全局限制 ==========
    client_max_body_size 50M;  # 支持最大 50MB 文件上传

    # ========== OPTIONS 请求处理 (命名location) ==========
    location @cors_options {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods $cors_method;
        add_header Access-Control-Allow-Headers $cors_header;
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type 'text/plain; charset=utf-8';
        add_header Content-Length 0;
        return 204;
    }

    # ========== API 网关代理 ==========
    # 匹配: https://fitness.dualseason.com/api/xxx
    # 转发到: http://127.0.0.1:8080/xxx
    location /api/ {
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            error_page 418 = @cors_options;
            return 418;
        }

        # 跨域请求头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        # URL 重写 - 去掉 /api 前缀
        rewrite ^/api/(.*) /$1 break;

        # 代理到网关
        proxy_pass http://127.0.0.1:8080;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置 - 标准API请求启用缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========== Swagger UI 代理 ==========
    # 匹配: https://fitness.dualseason.com/xxx/swagger-ui/xxx
    # 转发到: http://127.0.0.1:8080/xxx/swagger-ui/xxx
    location ~ ^/[^/]+/swagger-ui(/.*)?$ {
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            error_page 418 = @cors_options;
            return 418;
        }

        # 跨域请求头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        # 直接转发到网关（不去掉前缀）
        proxy_pass http://127.0.0.1:8080;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========== Swagger API 文档代理 ==========
    # 匹配: https://fitness.dualseason.com/xxx/v3/api-docs
    # 转发到: http://127.0.0.1:8080/xxx/v3/api-docs
    location ~ ^/[^/]+/v3/api-docs(/.*)?$ {
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            error_page 418 = @cors_options;
            return 418;
        }

        # 跨域请求头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        # 直接转发到网关（不去掉前缀）
        proxy_pass http://127.0.0.1:8080;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========== MinIO 对象存储代理 ==========
    # 匹配: https://fitness.dualseason.com/minio/xxx
    # 转发到: http://127.0.0.1:9001/xxx
    # 特点: 禁用缓冲以支持大文件上传/下载
    location /minio/ {
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            error_page 418 = @cors_options;
            return 418;
        }

        # 跨域请求头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        # URL 重写 - 去掉 /minio 前缀

        # 代理到 MinIO
        proxy_pass http://127.0.0.1:9001/;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # MinIO 特殊配置 - 禁用缓冲以支持大文件
        proxy_buffering off;
        proxy_request_buffering off;

        # 超时配置 - MinIO 可能需要较长的超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;    # 5分钟
        proxy_read_timeout 300s;    # 5分钟
    }

    # ========== Gateway 后端首页 (默认) ==========
    # 匹配: https://fitness.dualseason.com/ (根路径)
    # 转发到: http://127.0.0.1:8080 (Gateway 首页)
    location / {
        # 跨域配置
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, X-File-Name";
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
            return 204;
        }

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;

        # 代理到 Gateway 首页
        proxy_pass http://127.0.0.1:8080;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

# ============================================================================
# HTTP 服务器配置 - 重定向到 HTTPS
# ============================================================================
server {
    listen 80;
    server_name fitness.dualseason.com;

    # 所有 HTTP 请求重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}
