# ============================================================================
# Nginx 配置文件 - minio.fitness.dualseason.com
# 功能: MinIO 控制台专用访问
# ============================================================================

server {
    listen 443 ssl http2;
    server_name minio.fitness.dualseason.com;

    # SSL/TLS 证书配置（复用 fitness 域名的证书）
    ssl_certificate /etc/nginx/ssl/minio.fitness.dualseason.com_nginx/minio.fitness.dualseason.com_nginx/minio.fitness.dualseason.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/minio.fitness.dualseason.com_nginx/minio.fitness.dualseason.com_nginx/minio.fitness.dualseason.com.key;

    # SSL/TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志配置
    access_log /var/log/nginx/minio.fitness.dualseason.com.access.log;
    error_log /var/log/nginx/minio.fitness.dualseason.com.error.log;

    # 大文件上传支持
    client_max_body_size 100M;

    # 代理到 MinIO 控制台
    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 禁用缓冲以支持大文件
        proxy_buffering off;
        proxy_request_buffering off;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name minio.fitness.dualseason.com;
    return 301 https://$server_name$request_uri;
}
