# ============================================================================
# Nginx 配置文件 - nacos.fitness.dualseason.com
# 功能: Nacos 控制台专用访问
# ============================================================================

server {
    listen 443 ssl http2;
    server_name nacos.fitness.dualseason.com;

    # SSL/TLS 证书配置
    ssl_certificate /etc/nginx/ssl/nacos.fitness.dualseason.com_nginx/nacos.fitness.dualseason.com_nginx/nacos.fitness.dualseason.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/nacos.fitness.dualseason.com_nginx/nacos.fitness.dualseason.com_nginx/nacos.fitness.dualseason.com.key;

    # SSL/TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头配置
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # 日志配置
    access_log /var/log/nginx/nacos.fitness.dualseason.com.access.log;
    error_log /var/log/nginx/nacos.fitness.dualseason.com.error.log;

    # 大请求体支持
    client_max_body_size 50M;

    # 根路径重定向到 /nacos
    location = / {
        return 302 /nacos/;
    }

    # 代理到 Nacos（包含 /nacos 路径）
    location / {
        proxy_pass http://nacos:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name nacos.fitness.dualseason.com;
    return 301 https://$server_name$request_uri;
}
