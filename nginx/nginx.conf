# ============================================================================
# Nginx 主配置文件
# 功能: 全局配置、共享 CORS 配置、日志格式
# ============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# 加载动态模块
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    # ============================================================================
    # 基本设置
    # ============================================================================
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    # 包含 MIME 类型
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # SSL 设置
    # ============================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================================
    # 日志设置
    # ============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================================================
    # Gzip 设置
    # ============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ============================================================================
    # CORS 共享配置 - 使用 map 指令减少重复代码
    # ============================================================================
    map $request_method $cors_method {
        OPTIONS "GET, POST, PUT, DELETE, OPTIONS, PATCH";
        default "";
    }

    map $request_method $cors_header {
        OPTIONS "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, X-File-Name";
        default "";
    }

    # ============================================================================
    # 虚拟主机配置
    # ============================================================================
    include /etc/nginx/conf.d/*.conf;

    # ============================================================================
    # 健康检查端点
    # ============================================================================
    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
